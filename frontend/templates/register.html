{% extends "base.html" %}

{% block title %}Register - FraudShield AI Fraud Defense{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 1rem auto;">🛡️</div>
      <h2 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.35rem;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Register for an AI-guarded payment portal</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error-msg" style="display: none; padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #FCA5A5; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
    </div>

    <form id="register-form">
      <div style="margin-bottom: 1.15rem;">
        <label for="reg-name" class="form-label">Full Name</label>
        <input type="text" id="reg-name" class="form-control-custom" placeholder="Jane Doe" required autocomplete="name">
      </div>

      <div style="margin-bottom: 1.15rem;">
        <label for="reg-email" class="form-label">Email Address</label>
        <input type="email" id="reg-email" class="form-control-custom" placeholder="jane@example.com" required autocomplete="email">
      </div>

      <div style="margin-bottom: 1.15rem;">
        <label for="reg-password" class="form-label">Password (Min. 8 characters)</label>
        <input type="password" id="reg-password" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label for="reg-confirm-password" class="form-label">Confirm Password</label>
        <input type="password" id="reg-confirm-password" class="form-control-custom" placeholder="••••••••" required autocomplete="new-password">
      </div>

      <button type="submit" id="btn-register-submit" class="btn-primary-custom" style="width: 100%;">
        <span>Create Account</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
      Already registered? <a href="/login" style="font-weight: 600;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
{% endblock %}
