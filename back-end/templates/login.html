{% extends "base.html" %}

{% block title %}Sign In - FraudShield AI Fraud Defense{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="glass-card auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 1rem auto;">🛡️</div>
      <h2 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.35rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to your protected payment account</p>
    </div>

    <!-- Error Alert Box -->
    <div id="auth-error-msg" style="display: none; padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #FCA5A5; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
    </div>

    <form id="login-form">
      <div style="margin-bottom: 1.25rem;">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control-custom" placeholder="name@example.com" required autocomplete="email">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="/forgot-password" style="font-size: 0.8rem; color: #60A5FA; text-decoration: none; font-weight: 500;">Forgot Password?</a>
        </div>
        <input type="password" id="password" class="form-control-custom" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login-submit" class="btn-primary-custom" style="width: 100%; margin-bottom: 1.25rem;">
        <span>Sign In</span>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="font-weight: 600;">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
{% endblock %}
